<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${attendance.id != null} ? 'Edit Record' : 'Add Record'">Attendance Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:text="${attendance.id != null} ? 'Edit Attendance Record' : 'Add Attendance Record'">Attendance Form</h1>

    <form th:action="@{/attendance/save}" th:object="${attendance}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="personName" class="form-label">Person Name</label>
            <input type="text" class="form-control" id="personName" th:field="*{personName}">
            <div class="text-danger" th:if="${#fields.hasErrors('personName')}" th:errors="*{personName}"></div>
        </div>

        <div class="mb-3">
            <label for="event" class="form-label">Event</label>
            <input type="text" class="form-control" id="event" th:field="*{event}">
            <div class="text-danger" th:if="${#fields.hasErrors('event')}" th:errors="*{event}"></div>
        </div>

        <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" class="form-control" id="date" th:field="*{date}">
            <div class="text-danger" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>
        </div>

        <button type="submit" class="btn btn-primary" th:text="${attendance.id != null} ? 'Update' : 'Save'">Save</button>
        <a th:href="@{/attendance}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
