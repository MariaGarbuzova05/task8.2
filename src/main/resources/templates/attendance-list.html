<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Attendance Records</h1>
        <div>
            <span sec:authentication="name" class="me-3"></span>
            <a th:href="@{/logout}" class="btn btn-outline-secondary btn-sm">Logout</a>
        </div>
    </div>

    <div sec:authorize="hasRole('ADMIN')">
        <a th:href="@{/attendance/add}" class="btn btn-primary mb-3">Add New Record</a>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Person Name</th>
            <th>Event</th>
            <th>Date</th>
            <th sec:authorize="hasRole('ADMIN')">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="attendance : ${attendances}">
            <td th:text="${attendance.id}"></td>
            <td th:text="${attendance.personName}"></td>
            <td th:text="${attendance.event}"></td>
            <td th:text="${#temporals.format(attendance.date, 'yyyy-MM-dd')}"></td>
            <td sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/attendance/edit/{id}(id=${attendance.id})}" class="btn btn-sm btn-warning">Edit</a>
                <a th:href="@{/attendance/delete/{id}(id=${attendance.id})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
        <tr th:if="${attendances.empty}">
            <td colspan="5" class="text-center">No records found</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
